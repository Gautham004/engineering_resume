  <style>
    body { overflow: hidden; }
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 0 24px;
      z-index: 2;
    }
    .hero .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-muted);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
    }
    .hero .eyebrow .line {
      width: 36px; height: 1px; background: var(--rule-strong);
      display: inline-block;
    }
    .hero h1 {
      margin: 0;
      font-weight: 200;
      font-size: clamp(36px, 6vw, 76px);
      letter-spacing: clamp(6px, 1.2vw, 14px);
      text-transform: uppercase;
      line-height: 1.1;
    }
    .hero h1 .name {
      display: block;
      font-family: 'Outfit', var(--sans);
      font-weight: 700;
      letter-spacing: clamp(4px, 0.8vw, 10px);
      background: linear-gradient(to bottom, white 0%, #9aabbf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero h1 .role {
      display: block;
      font-size: clamp(14px, 1.6vw, 18px);
      letter-spacing: clamp(8px, 1.6vw, 18px);
      color: var(--fg-muted);
      margin-top: 22px;
      font-weight: 300;
    }
    .hero .actions {
      display: flex;
      gap: 16px;
      margin-top: 56px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .hero .actions .btn-primary .arrow {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-block;
    }
    .hero .actions .btn-primary:hover .arrow {
      transform: translateX(4px);
    }
    .hero .socials {
      display: flex;
      gap: 14px;
      margin-top: 32px;
      justify-content: center;
    }
    .hero .socials a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--fg-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition:
        transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
        color 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }
    .hero .socials a:hover {
      color: var(--fg);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }
    .hero .socials svg {
      width: 18px;
      height: 18px;
    }
    .hero .meta {
      position: absolute;
      bottom: 36px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 48px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--fg-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hero .meta .blink {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
      animation: blink 2.4s ease-in-out infinite;
      box-shadow: 0 0 10px var(--accent);
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @media (max-width: 640px) {
      .hero .meta { padding: 0 24px; flex-direction: column; gap: 8px; align-items: center; }
    }
  </style>
